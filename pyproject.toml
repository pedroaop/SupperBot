[project]
name = "discord-admin-mcp"
version = "0.1.0"
description = "Servidor MCP para administrar servidores Discord via API REST"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2", "httpx>=0.27"]

[project.scripts]
discord-admin-mcp = "discord_admin_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

